name: ai-tourism-db
services:
  db:
    build:
      context: .
      dockerfile: Dockerfile
    image: ai-tourism-postgres:17-postgis36-vector087
    container_name: ai-tourism-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ai_tourism_dev}
      POSTGRES_USER: ${POSTGRES_USER:-ai_tourism_owner}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Create .env from the initialization script first}
      POSTGRES_APP_USER: ${POSTGRES_APP_USER:-ai_tourism_app}
      TZ: UTC
      PGTZ: UTC
    ports:
      - "127.0.0.1:55433:5432"
    volumes:
      - ai_tourism_pgdata:/var/lib/postgresql/data
      - ./sql:/opt/ai-tourism/sql:ro
      - ./legacy:/opt/ai-tourism/legacy:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped

volumes:
  ai_tourism_pgdata:
    name: ai_tourism_pgdata
