name: Rahgard V2 isolated code quality
on:
  push:
    branches: [feat/rahgard-unified-travel-v2]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend typecheck, tests and PWA production build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: node --check scripts/traveler-e2e.mjs
      - run: npm test -- --reporter=dot
      - run: npm run build
      - run: npm run test:pwa-build


  frontend-windows:
    name: Windows Node26 frontend regression
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm.cmd ci
      - run: node --check scripts/traveler-e2e.mjs
      - run: npm.cmd test -- --reporter=dot
      - run: npx.cmd tsc -p tsconfig.json --noEmit

  backend-contract:
    name: Partner contracts, Ruff and Python syntax
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: |
          python -m pip install --upgrade pip
          python -m pip install "fastapi==0.121.0" "httpx==0.28.1" "psycopg[binary]==3.2.12" "pydantic-settings==2.11.0" "cryptography==46.0.7" "uvicorn==0.38.0" "pytest==8.4.2" "ruff==0.14.3"
      - run: python -m compileall -q backend/app/api/partners.py
      - run: python -m py_compile scripts/ops/rahgard_runtime_compose.py scripts/ops/prepare_rahgard_restore_web_config.py tests/unit/test_rahgard_runtime_compose.py tests/unit/test_rahgard_restore_web_config.py
      - run: python -m ruff check backend/app/core/config.py backend/app/api/partners.py backend/tests/test_platform_admin_mfa_secret_files.py backend/tests/test_partner_share_contract.py backend/tests/test_provider_admin_runtime.py backend/tests/test_provider_server_vault.py scripts/ops/check_rahgard_v2_ledger.py scripts/ops/capture_rahgard_0023_backup.py scripts/ops/rehearse_rahgard_v2_migrations.py scripts/ops/rahgard_runtime_compose.py scripts/ops/prepare_rahgard_restore_web_config.py tests/unit/test_rahgard_current_backup_guard.py tests/unit/test_rahgard_runtime_compose.py tests/unit/test_rahgard_restore_web_config.py
      - run: python -m pytest backend/tests/test_platform_admin_mfa_secret_files.py backend/tests/test_partner_share_contract.py backend/tests/test_provider_admin_runtime.py backend/tests/test_provider_server_vault.py tests/unit/test_rahgard_current_backup_guard.py tests/unit/test_rahgard_runtime_compose.py tests/unit/test_rahgard_restore_web_config.py -q
      - run: bash -n deploy/staging/compose-runtime.sh deploy/staging/deploy.sh deploy/staging/status.sh deploy/staging/rollback.sh deploy/staging/stop.sh deploy/staging/backup.sh deploy/staging/restore.sh deploy/staging/export-portable.sh deploy/staging/inspect-portable.sh deploy/staging/restore-portable.sh deploy/staging/restore-portable-runtime.sh deploy/staging/restore-portable-app-check.sh

  schema-documentation:
    name: Rahgard live-schema coverage and drift check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python tools/schema/validate_live_schema_docs.py
      - run: python tools/schema/generate_persian_owner_reference.py
      - run: git diff --exit-code -- docs/database/OWNER_REFERENCE_FA.md
