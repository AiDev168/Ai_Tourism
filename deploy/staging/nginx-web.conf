map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    client_max_body_size 128k;

    include /etc/nginx/mime.types;
    types { application/manifest+json webmanifest; }

    include /etc/nginx/rahgard-security-headers.conf;

    location = /health/live { return 404; }
    location = /health/ready { return 404; }
    location ~* ^/(admin|api/v1/admin|api/v1/auth/local-owner)(/|$) { return 404; }
    location ~* ^/api/v1/auth/(otp|debug|local-owner)(/|$) { return 404; }

    location ^~ /api/ {
        include /etc/nginx/rahgard-security-headers.conf;
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header Connection "";
        proxy_read_timeout 75s;
        proxy_send_timeout 30s;
        proxy_buffering off;
        add_header Cache-Control "no-store" always;
    }

    location = /sw.js {
        include /etc/nginx/rahgard-security-headers.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files $uri =404;
    }
    location = /manifest.webmanifest {
        include /etc/nginx/rahgard-security-headers.conf;
        default_type application/manifest+json;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files $uri =404;
    }
    location = /index.html {
        include /etc/nginx/rahgard-security-headers.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files $uri =404;
    }
    location /assets/ {
        include /etc/nginx/rahgard-security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }
    location / {
        include /etc/nginx/rahgard-security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
