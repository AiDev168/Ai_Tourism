# Windows Owner/Partner/Traveler demo overlay. Always use a unique Compose
# project and volume generated by engineering/pilot/issue27-local-demo.
services:
  db:
    ports:
      - "127.0.0.1:${RAHGARD_DB_BIND_PORT:-18543}:5432"
    networks:
      - staging_private
      - issue27_db_host
  api:
    environment:
      STAGING_PUBLIC_HOST: localhost
      AUTH_ALLOWED_ORIGINS: https://localhost
      STAGING_EMAIL_SIGNUP_ENABLED: "true"
      INTERNAL_CHAT_ENABLED: "false"
      AUTH_SMS_ADAPTER: disabled
      AI_PROVIDER_ADMIN_ENABLED: "false"
      TOURISM_RAG_ENABLED: "false"
  web:
    ports:
      - "127.0.0.1:${RAHGARD_WEB_BIND_PORT:-443}:8443"
    volumes:
      - ./nginx-issue27-local-demo.conf:/etc/nginx/conf.d/default.conf:ro
    secrets:
      - local_tls_cert
      - local_tls_key

secrets:
  local_tls_cert:
    file: ${RAHGARD_TLS_DIR:?Local TLS directory is required}/localhost.crt
  local_tls_key:
    file: ${RAHGARD_TLS_DIR:?Local TLS directory is required}/localhost.key

networks:
  issue27_db_host:
    driver: bridge
