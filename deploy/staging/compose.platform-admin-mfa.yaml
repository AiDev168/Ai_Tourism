name: ${RAHGARD_COMPOSE_PROJECT:-rahgard-staging}

# Opt-in overlay. Do not pass this file until an operator provisions the two
# protected files under RAHGARD_SECRET_DIR and verifies their permissions.
services:
  api:
    environment:
      PLATFORM_ADMIN_MFA_ENCRYPTION_KEY_FILE: /run/secrets/platform_admin_mfa_encryption_key_hex
      PLATFORM_ADMIN_RECOVERY_PEPPER_FILE: /run/secrets/platform_admin_recovery_pepper
    secrets:
      - platform_admin_mfa_encryption_key_hex
      - platform_admin_recovery_pepper

secrets:
  platform_admin_mfa_encryption_key_hex:
    file: ${RAHGARD_SECRET_DIR:?Set RAHGARD_SECRET_DIR in the private deployment config}/platform_admin_mfa_encryption_key_hex
  platform_admin_recovery_pepper:
    file: ${RAHGARD_SECRET_DIR:?Set RAHGARD_SECRET_DIR in the private deployment config}/platform_admin_recovery_pepper
