openapi: 3.1.0
info:
  title: AI Tourism MVP API
  version: 0.1.0
  summary: Draft contract for the first Persian travel-advisor journey
  description: |
    This is a Phase 0 design contract, not a statement that these routes are
    implemented or deployed. It captures the MVP route candidates from the
    implementation handoff and makes data/publication boundaries explicit.

    SECURITY GATE: User-owned /api/v1 routes require authenticated identity and
    object-level authorization before implementation or release. Published
    catalogue reads may be public only after the verified/editorially-approved
    publication gate is enforced. The identity
    provider and session scheme are unresolved in ADR-0006, so this document
    intentionally does not pretend a concrete bearer/cookie mechanism has been
    selected. Codex must not implement these routes as anonymous endpoints.
    Only /health/live and /health/ready may be exposed without user identity.

    STREAMING GATE: Message submission is shown as a JSON request/response
    baseline. SSE is the preferred future streaming direction, but event names,
    partial-output persistence, disconnect/cancellation, duplicate submission
    and finalization semantics must be reviewed before streaming is implemented.
    See the MVP handoff section 7.1 and 10.

    The schema uses UUID identifiers for user/conversation/trip/recommendation
    records and integer identifiers for destination catalogue rows, matching
    the current PostgreSQL schema.
  contact:
    name: AI Tourism project
  license:
    name: Proprietary project documentation
servers:
  - url: /
    description: Relative server URL; deployment host is not selected.
tags:
  - name: Health
  - name: Conversations
  - name: Catalogue
  - name: Recommendations
  - name: Itineraries
  - name: Feedback
  - name: Integrations
paths:
  /health/live:
    get:
      tags: [Health]
      operationId: getLiveness
      summary: Process liveness
      description: Does not query or reveal private application configuration.
      responses:
        '200':
          description: The API process is alive.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
  /health/ready:
    get:
      tags: [Health]
      operationId: getReadiness
      summary: Application readiness
      description: |
        Returns a minimal status only. It must not return connection strings,
        credentials, hostnames, stack traces or raw database/provider errors.
      responses:
        '200':
          description: Required local dependencies are reachable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
        '503':
          description: The application is not ready.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/conversations:
    post:
      tags: [Conversations]
      operationId: createConversation
      summary: Create a conversation
      description: |
        Creates a conversation owned by the authenticated principal. The
        server derives the owner from the validated identity; clients cannot
        choose user_id.
      x-authentication-required: true
      x-implementation-gate: ADR-0006
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateConversationRequest'
      responses:
        '201':
          description: Conversation created.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Conversation'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
  /api/v1/conversations/{conversation_id}:
    parameters:
      - $ref: '#/components/parameters/ConversationId'
    get:
      tags: [Conversations]
      operationId: getConversation
      summary: Read an owned conversation
      x-authentication-required: true
      x-implementation-gate: ADR-0006
      responses:
        '200':
          description: Conversation and its permitted message history.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/conversations/{conversation_id}/messages:
    parameters:
      - $ref: '#/components/parameters/ConversationId'
    post:
      tags: [Conversations]
      operationId: submitConversationMessage
      summary: Submit a user message
      description: |
        Draft JSON contract for one conversational turn. The conversation
        must belong to the authenticated principal. The backend persists the
        user message idempotently and validates every model-produced field.
        Hard constraints and factual provenance remain outside LLM authority.
        The exact SSE event contract is deferred.
      x-authentication-required: true
      x-implementation-gate: ADR-0006
      x-streaming-contract: deferred
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: Client-generated key unique within the conversation.
          schema:
            type: string
            minLength: 8
            maxLength: 128
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitMessageRequest'
      responses:
        '200':
          description: The turn has completed and its messages are persisted.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationTurn'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The idempotency key was reused with a conflicting payload.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          description: A required dependency is temporarily unavailable.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/destinations:
    get:
      tags: [Catalogue]
      operationId: listDestinations
      summary: List approved destinations
      description: |
        Public catalogue query policy must return only explicitly published,
        verified, non-synthetic rows. The 15 legacy rows and 17 UNESCO rows
        currently marked needs_review must remain excluded. Synthetic QA rows
        must never be returned.
      x-authentication-required: false
      x-publication-gate: verified-and-editorially-approved-and-non-synthetic
      parameters:
        - name: q
          in: query
          required: false
          schema:
            type: string
            maxLength: 160
        - name: province
          in: query
          required: false
          schema:
            type: string
            maxLength: 100
        - name: category
          in: query
          required: false
          schema:
            type: string
            maxLength: 64
        - name: page_size
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
        - name: page_token
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: A page of published destinations.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DestinationPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/destinations/{destination_id}:
    parameters:
      - name: destination_id
        in: path
        required: true
        schema:
          type: integer
          format: int64
          minimum: 1
    get:
      tags: [Catalogue]
      operationId: getDestination
      summary: Read one approved destination
      x-authentication-required: false
      x-publication-gate: verified-and-editorially-approved-and-non-synthetic
      responses:
        '200':
          description: Published destination with source summaries.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Destination'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/recommendations/{recommendation_id}:
    parameters:
      - name: recommendation_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [Recommendations]
      operationId: getRecommendation
      summary: Read a recommendation owned by the current user
      x-authentication-required: true
      x-implementation-gate: ADR-0006
      responses:
        '200':
          description: Recommendation, deterministic explanation and warnings.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Recommendation'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/itineraries/{itinerary_id}:
    parameters:
      - name: itinerary_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [Itineraries]
      operationId: getItinerary
      summary: Read an owned itinerary
      x-authentication-required: true
      x-implementation-gate: ADR-0006
      responses:
        '200':
          description: Itinerary with ordered day stops.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Itinerary'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Itineraries]
      operationId: updateItinerary
      summary: Update an owned itinerary
      description: |
        Only the authenticated owner can edit. The application validates that
        day_count is 1–3, day_number is within that range, stop_order is unique
        within a day, and referenced destinations are eligible for display.
        Route times and travel durations remain unknown unless provider-backed.
      x-authentication-required: true
      x-implementation-gate: ADR-0006
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateItineraryRequest'
      responses:
        '200':
          description: Updated itinerary.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Itinerary'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
  /api/v1/feedback:
    post:
      tags: [Feedback]
      operationId: submitFeedback
      summary: Submit feedback
      x-authentication-required: true
      x-implementation-gate: ADR-0006
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FeedbackRequest'
      responses:
        '201':
          description: Feedback accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeedbackAccepted'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'
  /api/v1/outbound-clicks:
    post:
      tags: [Integrations]
      operationId: recordOutboundClick
      summary: Resolve and record an allowlisted external-link click
      description: |
        Request carries only an external_link_id. The server loads the active
        allowlisted URL and records the click; it must not accept arbitrary
        redirect URLs from the client.
      x-authentication-required: true
      x-implementation-gate: ADR-0006
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [external_link_id]
              properties:
                external_link_id:
                  type: string
                  format: uuid
                trip_id:
                  type: string
                  format: uuid
                recommendation_id:
                  type: string
                  format: uuid
      responses:
        '201':
          description: Click recorded and an allowlisted target resolved.
          content:
            application/json:
              schema:
                type: object
                required: [click_id, target_url]
                properties:
                  click_id:
                    type: string
                    format: uuid
                  target_url:
                    type: string
                    format: uri
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
components:
  headers:
    RequestId:
      description: Server-generated correlation/request identifier.
      schema:
        type: string
  parameters:
    ConversationId:
      name: conversation_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    Unauthorized:
      description: Authentication is missing, expired or invalid.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: Resource does not exist or is not visible to the caller.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ValidationError:
      description: Request validation failed.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    RateLimited:
      description: Rate limit or quota exceeded.
      headers:
        Retry-After:
          schema:
            type: integer
            minimum: 1
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    HealthStatus:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [ok, ready]
        request_id:
          type: string
    Problem:
      type: object
      additionalProperties: false
      required: [code, message, request_id]
      properties:
        code:
          type: string
        message:
          type: string
        request_id:
          type: string
        retryable:
          type: boolean
        details:
          type: object
          additionalProperties: true
    CreateConversationRequest:
      type: object
      additionalProperties: false
      properties:
        language_code:
          type: string
          default: fa
          enum: [fa, en]
        channel:
          type: string
          default: pwa
          enum: [pwa, web, mobile_web]
    Conversation:
      type: object
      additionalProperties: false
      required: [conversation_id, language_code, status, started_at]
      properties:
        conversation_id:
          type: string
          format: uuid
        language_code:
          type: string
        status:
          type: string
          enum: [active, completed, archived]
        started_at:
          type: string
          format: date-time
    ConversationDetail:
      allOf:
        - $ref: '#/components/schemas/Conversation'
        - type: object
          required: [messages]
          properties:
            messages:
              type: array
              items:
                $ref: '#/components/schemas/Message'
    Message:
      type: object
      additionalProperties: false
      required: [message_id, role, content, message_type, created_at]
      properties:
        message_id:
          type: string
          format: uuid
        role:
          type: string
          enum: [user, assistant]
        content:
          type: string
        message_type:
          type: string
          enum: [text, structured, system_notice]
        created_at:
          type: string
          format: date-time
    SubmitMessageRequest:
      type: object
      additionalProperties: false
      required: [content]
      properties:
        content:
          type: string
          minLength: 1
          maxLength: 12000
    ConversationTurn:
      type: object
      additionalProperties: false
      required: [conversation_id, user_message, assistant_message, clarification_required]
      properties:
        conversation_id:
          type: string
          format: uuid
        user_message:
          $ref: '#/components/schemas/Message'
        assistant_message:
          $ref: '#/components/schemas/Message'
        clarification_required:
          type: boolean
        structured_trip_summary:
          type: object
          description: Validated editable trip fields; exact field schema is refined in Phase 2.
          additionalProperties: true
    DestinationSummary:
      type: object
      additionalProperties: false
      required: [destination_id, canonical_name, destination_type]
      properties:
        destination_id:
          type: integer
          format: int64
        canonical_name:
          type: string
        destination_type:
          type: string
        province_name:
          type: string
        city_name:
          type: [string, 'null']
        coordinate:
          type: [object, 'null']
          additionalProperties: false
          required: [latitude, longitude, coordinate_role]
          properties:
            latitude:
              type: number
              minimum: -90
              maximum: 90
            longitude:
              type: number
              minimum: -180
              maximum: 180
            coordinate_role:
              type: string
              enum: [property_reference, representative_point, visitor_entrance]
    Destination:
      allOf:
        - $ref: '#/components/schemas/DestinationSummary'
        - type: object
          required: [description, sources]
          properties:
            description:
              type: string
            sources:
              type: array
              items:
                $ref: '#/components/schemas/SourceSummary'
    SourceSummary:
      type: object
      additionalProperties: false
      required: [source_name, url]
      properties:
        source_name:
          type: string
        url:
          type: string
          format: uri
    DestinationPage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/DestinationSummary'
        next_page_token:
          type: [string, 'null']
    Recommendation:
      type: object
      additionalProperties: false
      required: [recommendation_id, rank, final_score, explanation, warnings, destination]
      properties:
        recommendation_id:
          type: string
          format: uuid
        rank:
          type: integer
          minimum: 1
        final_score:
          type: number
          minimum: 0
          maximum: 1
        explanation:
          type: string
        warnings:
          type: array
          items:
            type: string
        destination:
          $ref: '#/components/schemas/DestinationSummary'
    ItineraryStop:
      type: object
      additionalProperties: false
      required: [destination_id, day_number, stop_order]
      properties:
        destination_id:
          type: integer
          format: int64
        day_number:
          type: integer
          minimum: 1
          maximum: 3
        stop_order:
          type: integer
          minimum: 1
        planned_start_time:
          type: [string, 'null']
          format: time
        duration_minutes:
          type: [integer, 'null']
          minimum: 1
          maximum: 1440
        notes:
          type: [string, 'null']
    Itinerary:
      type: object
      additionalProperties: false
      required: [itinerary_id, version, title, day_count, stops]
      properties:
        itinerary_id:
          type: string
          format: uuid
        version:
          type: integer
          minimum: 1
        title:
          type: string
        day_count:
          type: integer
          minimum: 1
          maximum: 3
        stops:
          type: array
          items:
            $ref: '#/components/schemas/ItineraryStop'
    UpdateItineraryRequest:
      type: object
      additionalProperties: false
      required: [version, title, day_count, stops]
      properties:
        version:
          type: integer
          minimum: 1
          description: Current version supplied by the client; stale versions must be rejected.
        title:
          type: string
          minLength: 1
          maxLength: 160
        day_count:
          type: integer
          minimum: 1
          maximum: 3
        stops:
          type: array
          items:
            $ref: '#/components/schemas/ItineraryStop'
    FeedbackRequest:
      type: object
      additionalProperties: false
      required: [feedback_type]
      properties:
        feedback_type:
          type: string
          enum: [recommendation_rating, answer_quality, itinerary_quality, bug_report, other]
        rating:
          type: integer
          minimum: 1
          maximum: 5
        comment:
          type: string
          maxLength: 4000
        conversation_id:
          type: string
          format: uuid
        trip_id:
          type: string
          format: uuid
        recommendation_id:
          type: string
          format: uuid
    FeedbackAccepted:
      type: object
      additionalProperties: false
      required: [feedback_id, created_at]
      properties:
        feedback_id:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time

x-security-status: unresolved-mechanism; all user-owned /api/v1 operations require authentication and object-level authorization; published catalogue reads may be public only after publication gating
x-deferred-contracts:
  - Authentication/session scheme (ADR-0006)
  - SSE event schema and disconnect/cancellation/idempotency semantics
  - Structured trip requirement schema and clarification state machine
  - Weather provider response and freshness contract
  - Account deletion operation; retention/deletion policy is not approved
  - Deployment server URL and production hosting/region
