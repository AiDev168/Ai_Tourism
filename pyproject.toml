[project]
name = "ai-tourism"
version = "0.1.0"
description = "AI Tourism modular monolith API"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi==0.121.0",
    "psycopg[binary]==3.2.12",
    "pydantic-settings==2.11.0",
    "uvicorn[standard]==0.38.0",
]

[dependency-groups]
dev = ["httpx==0.28.1", "pytest==8.4.2", "ruff==0.14.3"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]

[tool.ruff]
line-length = 100
target-version = "py313"
